# =============================================================================
# Flux Utility Solutions - Deployment Configuration
# =============================================================================
# This file defines environment-specific variables for Jinja2 templating.
# Use with: snow git execute ... -D "database='FLUX_PROD'" -D "warehouse='FLUX_PROD_WH'"
#
# Supported Environments:
#   - dev: Development/sandbox environment
#   - staging: Pre-production testing
#   - prod: Production deployment
# =============================================================================

# -----------------------------------------------------------------------------
# Development Environment
# -----------------------------------------------------------------------------
dev:
  database: FLUX_DEV
  warehouse: FLUX_DEV_WH
  warehouse_size: XSMALL
  admin_role: FLUX_DEV_ADMIN
  user_role: FLUX_DEV_USER
  postgres_instance: FLUX_DEV_POSTGRES
  compute_pool: FLUX_DEV_POOL
  spcs_service: FLUX_DEV_OPS_CENTER
  schema: PRODUCTION            # scripts use <% schema %>
  source_db: FLUX_DEV            # 17_validation_queries.sql compares against this
  postgres_host: ""              # REQUIRED for 23_postgres_external_access.sql
  
# -----------------------------------------------------------------------------
# Staging Environment
# -----------------------------------------------------------------------------
staging:
  database: FLUX_STAGING
  warehouse: FLUX_STAGING_WH
  warehouse_size: SMALL
  admin_role: FLUX_STAGING_ADMIN
  user_role: FLUX_STAGING_USER
  postgres_instance: FLUX_STAGING_POSTGRES
  compute_pool: FLUX_STAGING_POOL
  spcs_service: FLUX_STAGING_OPS_CENTER
  schema: PRODUCTION            # scripts use <% schema %>
  source_db: FLUX_STAGING        # 17_validation_queries.sql compares against this
  postgres_host: ""              # REQUIRED for 23_postgres_external_access.sql

# -----------------------------------------------------------------------------
# Production Environment
# -----------------------------------------------------------------------------
prod:
  database: FLUX_PROD
  warehouse: FLUX_PROD_WH
  warehouse_size: MEDIUM
  admin_role: FLUX_PROD_ADMIN
  user_role: FLUX_PROD_USER
  postgres_instance: FLUX_OPERATIONS_POSTGRES
  compute_pool: FLUX_INTERACTIVE_POOL
  spcs_service: FLUX_OPS_CENTER
  schema: PRODUCTION            # scripts use <% schema %>
  source_db: FLUX_PROD           # 17_validation_queries.sql compares against this
  postgres_host: ""              # REQUIRED for 23_postgres_external_access.sql

# -----------------------------------------------------------------------------
# Local/Demo Environment (for quick testing with existing data)
# -----------------------------------------------------------------------------
local:
  database: FLUX_DATABASE
  warehouse: FLUX_WH
  warehouse_size: MEDIUM
  admin_role: ACCOUNTADMIN
  user_role: PUBLIC
  postgres_instance: FLUX_OPERATIONS_POSTGRES
  compute_pool: FLUX_INTERACTIVE_POOL
  spcs_service: FLUX_OPS_CENTER
  schema: PRODUCTION            # scripts use <% schema %>
  source_db: FLUX_DATABASE       # 17_validation_queries.sql compares against this
  postgres_host: ""              # REQUIRED for 23_postgres_external_access.sql

# -----------------------------------------------------------------------------
# Scratch environment for deploy dry-runs. Points at a throwaway database and
# REUSES the existing warehouse/pool so a dry-run never provisions costly
# account-level infrastructure. Safe to drop at any time.
# -----------------------------------------------------------------------------
deploytest:
  database: FLUX_DEPLOYTEST
  warehouse: FLUX_WH
  warehouse_size: MEDIUM
  admin_role: ACCOUNTADMIN
  user_role: PUBLIC
  postgres_instance: FLUX_OPS_POSTGRES
  compute_pool: FLUX_OPS_CENTER_POOL
  spcs_service: FLUX_DEPLOYTEST_SVC
  schema: PRODUCTION            # scripts use <% schema %>
  source_db: FLUX_DB            # 17_validation_queries.sql compares against this
  postgres_host: ""             # REQUIRED for 23_postgres_external_access.sql

# -----------------------------------------------------------------------------
# Common Settings (shared across all environments)
# -----------------------------------------------------------------------------
common:
  # Schema names (standardized)
  production_schema: PRODUCTION
  applications_schema: APPLICATIONS
  raw_schema: RAW
  ml_schema: ML
  archive_schema: ARCHIVE
  
  # Cortex AI settings
  cortex_search_warehouse: COMPUTE_WH
  cortex_analyst_model: auto
  cortex_agent_model: auto
  
  # SPCS settings
  min_instances: 1
  max_instances: 3
  auto_suspend_seconds: 3600
  
  # PostgreSQL settings
  postgres_size: HIGHMEM_XL
  postgres_version: "17"  # Any supported version works; 17 is tested/recommended
  
  # Data retention
  data_retention_days: 7
  
  # Seed data stage
  seed_data_stage: "@flux_seed_data"

  # AMI sample window used by 51_generate_ami_sample.sql
  days: 30

  # Git integration (19_git_integration.sql)
  git_repo_url: "https://github.com/sfc-gh-abannerjee/flux-utility-solutions.git"
  # Snowflake GIT REPOSITORY object created by 19_git_integration.sql. This is the
  # object NAME, not the URL -- 51_load_seed_data.sql builds a stage path from it.
  git_repo_name: FLUX_SOLUTIONS_REPO

  # postgres_password is intentionally ABSENT. It is a credential and must not be
  # committed. deploy.py reads it from the FLUX_POSTGRES_PASSWORD env var instead.

