# Flux Data Forge - SPCS Service Specification
#
# Streaming synthetic data generator for utility demo data.
# Generates AMI readings, outage events, and transformer telemetry.

spec:
  containers:
  - name: data-forge
    image: /{{ database }}/{{ schema }}/{{ image_repo }}/flux_data_forge:latest
    
    env:
      # Snowflake connection
      SNOWFLAKE_ACCOUNT: "{{ account }}"
      SNOWFLAKE_WAREHOUSE: "{{ warehouse }}"
      SNOWFLAKE_DATABASE: "{{ database }}"
      SNOWFLAKE_SCHEMA: "PRODUCTION"
      
      # Generation settings
      GENERATION_MODE: "streaming"           # streaming | batch
      RECORDS_PER_SECOND: "1000"             # Target throughput
      BATCH_SIZE: "10000"                    # Records per batch
      
      # Output destinations
      OUTPUT_SNOWFLAKE: "true"               # Write to Snowflake tables
      OUTPUT_STAGE: "true"                   # Write to internal stage
      OUTPUT_EXTERNAL_STAGE: "false"         # Write to S3/GCS/Azure
      STAGE_PATH: "@{{ database }}.{{ schema }}.DATA_FORGE_STAGE"
    
    resources:
      requests:
        memory: 2Gi
        cpu: "2"
      limits:
        memory: 4Gi
        cpu: "4"
    
    readinessProbe:
      port: 8080
      path: /health
  
  endpoints:
  - name: api
    port: 8080
    public: true
  
  min_instances: 1
  max_instances: 3
